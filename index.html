async function goOnline(code,fresh){

async function goOnlineMQ(code,fresh){
  if(typeof WebSocket==='undefined')return'none';

    if(sub==='h'){if(typeof d.c!=='string'||d.c===cid)return;if(d.off){delete M.peers[d.c]}else{const isNew=!M.peers[d.c];M.peers[d.c]={r:d.r==='A'||d.r==='B'?d.r:null,t:Date.now()};if(isNew){heartbeat(true);if(S.started)pushPresence(true)}}readPeers();return}

  for(const u of MQ_BROKERS.slice(0,2)){const cl=mqClient(u,cid,will,onMsg,onUp,onDown,fresh?[[base+'s/A',''],[base+'s/B','']]:null);cl.sub(base+'#');M.clients.push(cl)}

  for(let i=0;i<60;i++){if(anyUp())return'ok';await new Promise(r=>setTimeout(r,200))}

    radio:['（手腕上的無線電發出雜訊）','「……有人嗎？我是沈霏。我在下層醫療艙，好黑……門打不開。林澈，是你嗎？」'],after:['沈霏。一年前被調離的海洋生物學家。她怎麼會在下層？','你按下通話鍵：「我在主控樞紐。別亂動，我想辦法把電恢復。」']},
  B:{t:'下層甲板・醫療艙',p:['你在醫療艙的病床上醒來。點滴被扯斷了，針孔還在滲血。','四周一片漆黑，你手裡握著一支手電筒。','你是沈霏，海洋生物學家。一年前你因為一份被壓下來的研究報告，被調離了第七號站。三天前你收到一封匿名郵件：「回來。只有你看得懂。」','地板上有水，正在慢慢變深。'],
    radio:['（手腕上的無線電亮了）','「沈霏？我是林澈，在上層主控樞紐。主電源斷了，我想辦法恢復。你先看看身邊有什麼。」'],after:['你們之間隔著一層甲板。唯一相通的，只有無線電，和牆裡那條物資傳送管。','（點畫面可以移動手電筒的光。）']}};

  c.fillStyle='rgba(230,200,120,.85)';c.fillRect(x+3,y+12,w-6,3);c.fillRect(x+3,y+h-18,w-6,3);if(label){c.save();c.translate(x+w/2,y+h/2);c.fillStyle='#f2e6c0';c.font='700 '+Math.min(w*.62,15)+'px '+FFH;c.textAlign='center';c.textBaseline='middle';[...label].forEach((ch,i,a)=>c.fillText(ch,0,(i-(a.length-1)/2)*Math.min(w*.7,17)));c.restore()}c.restore()}

END1.A=['發電機的轟鳴蓋過了警報。主控台上每一個螢幕同時亮起，研究站其他的門也有電了。','監視器裡，中央環廊的水正在退。沈霏站在水裡，朝鏡頭比了個大拇指。','然後，培養室的那個鏡頭裡，有什麼東西慢慢轉過頭來，看著你。'];
END1.B=['燈全亮了。環廊的水往排水口退去，地板上露出一道長長的拖痕，一路拖向聲納室。','無線電裡傳來林澈的聲音：「成功了。沈霏，你聽得到嗎？」','你正要回答，無線電裡又響起一個聲音——是你自己的聲音：「聽得到。我在這裡。」','可是你還沒有開口。'];
function showSliceEnd(){const c=$('#dlgC');c.innerHTML='<div class="tag">第一部分・完成</div><h2>主電源恢復</h2>'+pHTML(END1[S.R])+'<p class="sys">研究站的其他門都通電了。打開「地圖」看看哪裡可以去。</p><div class="row"><button class="bt" id="endOk">繼續</button></div>';$('#dlg').hidden=false;sfx('door');$('#endOk').onclick=()=>{$('#dlg').hidden=true;checkGates()}}
const ENDING={A:['你拉下釋放桿的同時，沈霏也拉下了她的。','對接夾「鏘」地鬆開，SUB-7 輕輕一晃，離開了第七號站。','你從舷窗往後看。研究站的燈一盞一盞熄滅，像一座沉進海底的城市。培養室那一格窗，還亮著藍白色的冷光。','三千兩百公尺。兩千。一千。','沈霏坐在你旁邊，一直沒有說話。快到海面的時候，她才小聲問：「你記得我們第一次見面在哪裡嗎？」','你想了很久，答不出來——那七十二小時以前的事，你也記不太清楚了。','她笑了：「沒關係。我記得。」','潛水器衝出海面。天剛亮。','她的聲音，三條泛音帶。是真的。'],
  B:['你拉下釋放桿的同時，林澈也拉下了他的。','對接夾鬆開，SUB-7 離開了第七號站。舷窗外，研究站的燈一盞一盞熄滅。','你一直看著培養室那一格窗。冷光裡，有一張蒼白的臉貼在玻璃上，看著你們離開。那張臉，一半像你，一半像他。','三千兩百公尺。兩千。一千。','你問林澈：「你記得我們第一次見面在哪裡嗎？」他想了很久，答不出來。','你沒有告訴他，你其實也不記得了。你只是想聽聽他的聲音——三條泛音帶。是真的。','潛水器衝出海面。天剛亮。','你們誰都沒有叫對方的名字。']};
function showFinalEnding(){add('end2.'+S.R);const c=$('#dlgC');c.innerHTML='<div class="tag">結局</div><h2>浮上</h2>'+pHTML(ENDING[S.R])+'<p class="sys">《深海第七號站》完。謝謝你們一路互相確認彼此的聲音。</p><div class="row"><button class="bt" id="endStay">留在海面</button><button class="bt g" id="endTitle">回到標題</button></div>';$('#dlg').hidden=false;sfx('end');stopDrone();$('#endStay').onclick=()=>{$('#dlg').hidden=true};$('#endTitle').onclick=()=>location.reload()}
NOTICES.push({id:'hydro',c:()=>has('hydro'),t:R=>R==='A'?'東側傳來一聲沉重的金屬回彈聲——觀測室的門鬆開了。':null},
  {id:'dL2',c:()=>has('dL2'),t:R=>R==='B'?'聲納室的門燈轉綠了。':null},

  {id:'pullO',c:()=>has('pull.'+ROLE[S.R||'A'].o)&&!has('pull.'+(S.R||'A')),t:R=>ROLE[ROLE[R].o].nm+'已經拉下釋放桿了。'});
function hintStage2(R){const L=(id,t,list)=>({id,t,list});
  if(R==='A'){
    if(!has('dU1'))return L('c1','通訊室',['主電源恢復後，主控樞紐北側通訊室的密碼面板亮了：「請輸入值班頻率（六碼）」。','值班頻道是大家手腕上戴的那一台。下層中央環廊漂浮的吳正手裡也握著一台——請沈霏看看。','吳正的無線電顯示 CH7・147.250 MHz。輸入 147250。']);
    if(!has('radioOK'))return L('c2','站內無線電',['通訊室的無線電台可以調頻率。站長有一個私人頻率。','站長置物櫃門內側的照片，翻到背面看看。','照片背面寫著 418.0。把轉輪調到 4180。']);
    if(!has('triGot'))return L('c3','暗格',['無線電下方的暗格彈開了，裡面有三角鑰匙。']);
    if(!has('dL2'))return L('c4','遠端門禁',['沈霏那邊的聲納室門壞了，要從主控台遠端解鎖。','主控台左側的小螢幕變成「遠端門禁」，需要聲納技師的工號後四碼——體檢紀錄在沈霏手上。','聲納技師許明哲：S7-07208 → 7208。']);
    if(!has('dU2'))return L('c5','檔案室',['用三角鑰匙打開主控樞紐西側的檔案室。']);
    if(!has('mimicRead'))return L('c6','機密檔案',['檔案櫃右下角那格「機密」被撬開了，看看裡面。']);
    if(!has('dL5')&&holderOf('card')==='A')return L('c7','門禁卡',['沈霏下層的培養室需要 A 級門禁卡——就是你手上那張站長門禁卡。','用物資傳送管送下去，她要回醫療艙收件。']);
    if(!has('hydro'))return L('c8','觀測室',['觀測室的門卡死了，液壓源在下層幫浦間，要請沈霏處理。','你這邊的通訊室有一台摩斯電碼印表機，紙帶標著「TO：幫浦間」。用牆上的對照表解碼，念給沈霏。','紙帶：···−− ·−−−− ····− ··−−− → 3、1、4、2。']);
    if(!has('dU5'))return L('c9','書架',['檔案室的書架會動。觀測室的潛水日誌寫著五次下潛的日期，頁面順序被打亂了。','依日期排序：熱泉（3/02）→ 北壁（4/15）→ 鯨骨（5/30）→ 黑煙囪（7/21）→ 海溝（9/01）。','書架由左到右是：鯨骨、海溝、北壁、熱泉、黑煙囪。依序拉：第 4、3、1、5、2 本。']);
    if(!has('hull'))return L('c10','探照燈',['檔案室的海圖桌上，SUB-7 最後的訊號在 E-6。請沈霏用聲納室的聲納確認方位。','聲納回報：方位 045°、仰角 30°。','觀測室探照燈輸入 04530。']);
    if(!has('safeOpen'))return L('c11','保險箱',['站長室的保險箱密碼是「小雨掉第一顆牙的那天」。','站長置物櫃那張照片的背面寫著：2087.06.11。','輸入 0611。']);
    if(!has('hatchA'))return L('c12','緊急梯',['保險箱裡有一根「緊急梯」拉桿。拉下來，站長室西側的艙口就會打開。']);
  }else{
    if(!has('dL2'))return L('d1','聲納室',['聲納室的面板壞了，下面寫著可以由上層主控樞紐遠端解鎖。','林澈需要聲納技師的工號後四碼——你的體檢紀錄上有。','許明哲：S7-07208 → 7208。另外，吳正的無線電顯示的頻率，林澈開通訊室會用到。']);
    if(!has('voiceOK'))return L('d2','聲紋比對',['聲納室東側有一台聲紋比對機，旁邊貼著判讀守則。','真人的聲紋有三條泛音帶，模仿的只有兩條。','答案：錄音 2。']);
    if(!has('eyeGot'))return L('d3','私人抽屜',['聲紋比對通過後，西側許明哲書桌的私人抽屜解鎖了。']);
    if(!has('dL3'))return L('d4','宿舍區',['眼紋鑰匙可以打開中央環廊南側宿舍區的大鎖。']);
    if(!has('jackGot'))return L('d5','陳立的置物櫃',['陳立的置物櫃密碼是「我下一次潛水的日子」。','陳立床尾的月曆，9 月 9 日圈起來寫著「下一次潛水」。','輸入 0909。']);
    if(!has('dL4'))return L('d6','幫浦間',['幫浦間門口壓著鋼梁。用陳立的液壓千斤頂撐開。']);
    if(!has('wrenchGot'))return L('d7','扳手',['幫浦間的閥門需要扳手。宿舍區的淋浴間排水孔裡卡著東西。']);
    if(!has('valves'))return L('d8','閥門順序',['吳正的日記說，閥門順序用摩斯電碼發到上層通訊室了——請林澈解碼。','先把扳手套上閥門，再照順序轉。','順序：3、1、4、2。']);
    if(!has('hydro'))return L('d9','液壓',['閥門開好後，拉下液壓分配盤上「觀測室門」的拉桿，林澈那邊的觀測室就會打開。']);
    if(!has('sonarOK'))return L('d10','聲納',['林澈的海圖上，SUB-7 最後的訊號在 E-6。','聲納左旋鈕選欄、右旋鈕選列，調到 E-6 再按 PING。','把聲納回報的方位和仰角告訴林澈。']);
    if(!has('dL5'))return L('d11','培養室',['幫浦間的培養室門需要 A 級門禁卡。林澈有一張站長門禁卡，請他用傳送管送下來，回醫療艙收件。']);
    if(!has('cooled'))return L('d12','溫控',['鳴體高於 4°C 就會醒來。林澈檔案室的機密檔案寫著它的弱點。','把溫控設定成 04。']);
    if(!has('hatchB'))return L('d13','潛水艙',['鳴體睡著之後，西側通往潛水艙的門就能過去了。站長手裡的紙條要念給林澈聽。']);
  }
  if(!has('subKey'))return L('e1','潛水器',['兩人都到潛水艙後：林澈把啟動鑰匙插進控制台左邊的鑰匙孔。']);
  if(!has('subCode'))return L('e2','艇號',['艇號就寫在潛水器上，林澈用觀測室的探照燈看過：7031。']);
  if(!has('verified.'+R))return L('e3','門外的聲音',['內艙門外有人用夥伴的聲音叫你。站長說過：門外的聲音不是人。','選擇「先用無線電確認」。']);
  if(!has('pull.'+R))return L('e4','釋放',['兩個人各自拉下自己名字的那根釋放桿。']);
  return L('e5','浮上',['等夥伴也拉下釋放桿。'])}
{const old=hintStage;hintStage=function(R){if(!has('gen'))return old(R);return hintStage2(R)}}
{const oldGates=checkGates;checkGates=function(){if(S.started&&has('pull.A')&&has('pull.B')&&!has('end2.'+S.R)&&$('#dlg').hidden){setTimeout(()=>{if(!has('end2.'+S.R))showFinalEnding()},900);return}oldGates()}}
